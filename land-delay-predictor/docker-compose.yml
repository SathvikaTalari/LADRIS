services:
  postgres:
    image: postgres:15-alpine
    container_name: ladris_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: land_delay
    ports:
      - "5432:5432"
    volumes:
      - ladris_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d land_delay"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ladris_pgdata:
    driver: local
